name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'build/xo3d-foundation' || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Verify checked-out Gradle project
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -d app
          pwd
          ls -la
      - name: Run unit tests
        run: gradle :engine:test :bluetooth:testDebugUnitTest :app:testDebugUnitTest
      - name: Run Release lint
        run: gradle :app:lintRelease
      # assembleRelease currently produces app-release-unsigned.apk.
      # A debug variant is signed automatically by Android Gradle Plugin,
      # so the APK can be installed directly while keeping arm64-v8a only.
      - name: Build installable ARM64 APK
        run: gradle :app:assembleDebug
      - name: Locate installable APK
        id: installable-apk
        shell: bash
        run: |
          echo "Generated APK files:"
          find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print
          APK_PATH="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::Gradle completed but no Debug APK was found."
            exit 1
          fi
          if [[ "$APK_PATH" == *unsigned* ]]; then
            echo "::error::The generated APK is unsigned."
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: XO3D-arm64-installable
          path: ${{ steps.installable-apk.outputs.path }}
          if-no-files-found: error
