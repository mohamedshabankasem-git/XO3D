name: Android CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Manual runs started from main must build the actual project branch.
          # Pull-request runs keep the PR merge commit selected by GitHub.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'build/xo3d-foundation' || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Verify checked-out Gradle project
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -d app
          pwd
          ls -la
      - name: Run unit tests
        run: gradle :engine:test :bluetooth:testDebugUnitTest :app:testDebugUnitTest
      - name: Run Release lint
        run: gradle :app:lintRelease
      - name: Build Release APK
        run: gradle :app:assembleRelease
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: XO3D-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
